    <rect x="269" y="100" width="62" height="9" rx="4.5" fill="white" fill-opacity="0.95"/>
    <rect x="269" y="123" width="43" height="9" rx="4.5" fill="white" fill-opacity="0.8"/>
    <rect x="269" y="146" width="54" height="9" rx="4.5" fill="white" fill-opacity="0.8"/>
    <circle cx="334" cy="182" r="31" fill="#0F172A"/>
    <path d="M323 181L331 189L346 171" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
