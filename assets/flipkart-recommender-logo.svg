    <path d="M153 91V80C153 64.5 165.5 52 181 52C196.5 52 209 64.5 209 80V91" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <rect x="142" y="119" width="78" height="10" rx="5" fill="white" fill-opacity="0.92"/>
